name: safety qualification

on:
  push:
    branches: [master, Domathon, Dom, StarPilot, stable, testing, dev]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host_gates:
    name: ${{ matrix.gate }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        gate: [coverage, opendbc-misra, panda-misra, panda-host]
    steps:
    - uses: actions/checkout@v7
    - run: ./tools/op.sh setup
    - name: Run isolated source-pinned gate
      run: .venv/bin/python tools/ci/run_safety_qualification.py --gate "${{ matrix.gate }}" --output "ci-results/safety-${{ matrix.gate }}"
    - name: Save full gate evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: safety-${{ matrix.gate }}
        path: ci-results/safety-${{ matrix.gate }}/
        if-no-files-found: error

  failure_summary:
    name: failure summary
    needs: host_gates
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
    - uses: actions/checkout@v7
    - name: Summarize failures against the previous run on this branch
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 -m tools.ci.failure_summary --job "failure summary" --output ci-results/failure-summary
    - name: Save failure summary for the next run
      uses: actions/upload-artifact@v4
      with:
        name: failure-summary
        path: ci-results/failure-summary/
        if-no-files-found: error
